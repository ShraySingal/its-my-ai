name: Build IT'S MY AI Mobile APK

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/**'
  workflow_dispatch: # Allows you to click 'Run workflow' anytime on GitHub

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/ItsMyAIMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ItsMyAIMobile-APK
          path: build_output/ItsMyAIMobile.apk
          retention-days: 30
